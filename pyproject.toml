[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "heat3d-ext-forza"
version = "1.2.0"
description = "Courses, races and cars out of an installed Forza (Horizon or Motorsport, the ForzaTech engine) for the 3DHeat viewer"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "heat3d-gamefiles @ https://github.com/Holdi601/3DHeat-GameFiles/archive/refs/tags/v1.1.0.zip",
    "numpy>=2.0",
    "lz4>=4.3",
    "Pillow>=10.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
heat3d-forza-maps = "heat3d_ext_forza.cli:main"

[tool.setuptools]
packages = ["heat3d_ext_forza", "heat3d_ext_forza.app"]
